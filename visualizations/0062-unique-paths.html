<!DOCTYPE html>

<title>62 - Unique Paths</title>

<script src="_engine.js"></script>
<script>

var SRC = ["class Solution:", "    def uniquePaths(self, m: int, n: int) -> int:", "        row = [1] * n", "", "        for i in range(m - 1):", "            newRow = [1] * n", "            for j in range(n - 2, -1, -1):", "                newRow[j] = newRow[j + 1] + row[j]", "            row = newRow", "", "        return row[0]"];
function build(){
  var T=LV.trace(), m=3, n=7;
  var row=new Array(n).fill(1), newRow=null, iter=0;
  function grid(cur){ var g=[]; 
    for(var r=0;r<m;r++){ g.push(new Array(n).fill('·')); }
    return g; }
  function V(j,note){ var vs=[];
    if(newRow) vs.push(LV.arr('newRow — the row being computed (row '+(m-2-iter+1)+' from the bottom)', newRow.map(function(x){ return x==null?'·':x; }),
      (function(){ var mm={}; for(var x=0;x<n;x++){ if(j!=null&&x===j) mm[x]='hot'; else if(j!=null&&x>j) mm[x]='good'; else mm[x]='dim'; } return mm; })(), {}));
    vs.push(LV.arr('row — the row below (already solved)', row.slice(),
      (function(){ var mm={}; if(j!=null) mm[j]='win'; return mm; })(), {}));
    if(note) vs.push(LV.html('why', '<div class="vnote">'+note+'</div>'));
    return vs; }
  function VA(){ return ['m = <b>3</b> rows','n = <b>7</b> cols','pass <em>'+iter+'</em> of '+(m-1)]; }

  T.step(3,'info','Start with the BOTTOM row: from any cell on the last row there is exactly one path to the corner — keep moving right. So every entry is 1.',VA(),V(null));
  for(iter=1;iter<m;iter++){
    newRow=new Array(n).fill(null); newRow[n-1]=1;
    T.step(6,'call','New row, initialised to 1s. The rightmost cell is genuinely 1 (only "down" is available from the last column), which is why the boundary needs no special case.',VA(),V(null));
    for(var j=n-2;j>=0;j--){
      newRow[j]=newRow[j+1]+row[j];
      T.step(8,'push','newRow['+j+'] = newRow['+(j+1)+'] ('+newRow[j+1]+', the cell to the RIGHT) + row['+j+'] ('+row[j]+', the cell BELOW) = <b>'+newRow[j]+'</b>. Every path from here starts with one of exactly two moves.',VA(),V(j));
    }
    row=newRow; newRow=null;
    T.save('row '+iter+' from bottom: ['+row.join(', ')+']');
    T.step(9,'ok','`row = newRow` — the finished row becomes the "below" row for the next pass. Only ONE row is ever kept, which is what makes this O(n) space instead of O(mn).',VA(),V(null));
  }
  T.step(11,'done','Answer: <b>'+row[0]+'</b> paths. row[0] is the top-left corner, which is where the robot starts.',['answer = <u>'+row[0]+'</u>'],V(null));
  return T;
}
LV.render({
  num:'62', name:'Unique Paths', slug:'0062-unique-paths',
  difficulty:'Medium', pattern:'Grid DP · rolling row',
  url:'https://leetcode.com/problems/unique-paths',
  blurb:'Grid DP solved bottom-up, keeping only one row. Same recurrence as the m×n table version, one dimension of memory less — and there is also a pure combinatorics answer with no DP at all.',
  input:'m = 3, n = 7', runName:'uniquePaths',
  skipLabel:null, emptyResult:'no rows finished yet',
  src:SRC, build:build,
  complexity:{time:'O(m·n)', space:'O(n) — one row; the naive table is O(m·n)'},
  theory:{
    idea:'paths(r, c) = paths(r+1, c) + paths(r, c+1), because the first move is either down or right and those two sets of paths are disjoint. Because each row only depends on the row directly below it, you can throw away everything else — the classic <b>rolling array</b> optimisation for grid DP.',
    recognize:[
      'Movement on a grid restricted to two directions (right/down), counting paths or minimising cost.',
      'A recurrence where cell (r,c) depends only on (r±1, c) and (r, c±1) — that locality is what permits the rolling row.',
      'Whenever the DP table row i depends only on row i−1, the space drops by a whole dimension.'
    ],
    pitfalls:[
      '<b>Iterating in the wrong direction.</b> This code fills newRow from right to left because <code>newRow[j]</code> needs <code>newRow[j+1]</code>, which must already be final. Reverse it and you read a stale value.',
      '<b>Boundaries.</b> The last row and last column are all 1s. Initialising with <code>[1] * n</code> handles both without an <code>if</code>.',
      '<b>Confusing m and n.</b> m is rows, n is columns. Swapping them still gives the right answer here (the formula is symmetric) but will bite you the moment obstacles are added.',
      '<b>Missing the combinatorics.</b> The answer is C(m+n−2, m−1) — you make m+n−2 moves and choose which m−1 are "down". O(min(m,n)) with no DP at all, and interviewers love that you noticed.'
    ],
    template: "# Grid DP with a rolling row - O(n) space instead of O(m*n)\nrow = [1] * n                      # the bottom row: one path from anywhere\nfor _ in range(m - 1):\n    newRow = [1] * n               # last column is 1 -> no boundary branch\n    for j in range(n - 2, -1, -1): # RIGHT to LEFT: newRow[j+1] must be final\n        newRow[j] = newRow[j + 1] + row[j]     # right + below\n    row = newRow\nreturn row[0]\n\n# and the closed form, worth stating:  C(m + n - 2, m - 1)\n",
    variants:[
      ['<b>Unique Paths II</b> (LC 63)','Obstacles — set blocked cells to 0. The combinatorics shortcut dies here, which is the point of the sequel.'],
      ['<b>Minimum Path Sum</b> (LC 64)','Replace <code>+</code> with <code>min</code> and add the cell cost.'],
      ['Diagonal moves allowed','Three terms in the recurrence instead of two.'],
      ['Combinatorial answer','C(m+n−2, m−1). Give this alongside the DP.'],
      ['<b>Number of Paths with Max Score</b> (LC 1301)','Two DP tables in parallel — best score and how many ways achieve it.']
    ],
    thinking:'Two habits from this problem. First: <b>always check whether a counting DP has a closed form.</b> Paths on an unobstructed grid, balanced parentheses, binary strings with no two adjacent 1s — all have formulas, and spotting one is free credit. Second: <b>after writing any 2D DP, ask which rows the recurrence actually reaches back to.</b> If it is only the previous one, you can drop to a single array; if only the previous cell, to a single variable. That reduction is asked for so often it should be automatic.'
  }
});

</script>
