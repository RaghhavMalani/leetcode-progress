<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3620 - Network Recovery Pathways</title>
<link rel="stylesheet" href="_engine.css">
</head>
<body>
<script src="_engine.js"></script>
<script>

var SRC = ["class Solution:", "    def findMaxPathScore(", "        self,", "        edges: List[List[int]],", "        online: List[bool],", "        k: int", "    ) -> int:", "        n = len(online)", "", "        graph = [[] for _ in range(n)]", "        indegree = [0] * n", "", "        max_cost = 0", "", "        for u, v, cost in edges:", "            graph[u].append((v, cost))", "            indegree[v] += 1", "            max_cost = max(max_cost, cost)", "", "        q = deque()", "", "        for i in range(n):", "            if indegree[i] == 0:", "                q.append(i)", "", "        topo = []", "", "        while q:", "            node = q.popleft()", "            topo.append(node)", "", "            for nei, cost in graph[node]:", "                indegree[nei] -= 1", "                if indegree[nei] == 0:", "                    q.append(nei)", "", "        def can(min_edge_score: int) -> bool:", "            INF = 10**30", "            dist = [INF] * n", "            dist[0] = 0", "", "            for u in topo:", "                if dist[u] == INF:", "                    continue", "", "                if dist[u] > k:", "                    continue", "", "                if not online[u]:", "                    continue", "", "                for v, cost in graph[u]:", "                    if cost < min_edge_score:", "                        continue", "", "                    if not online[v]:", "                        continue", "", "                    new_cost = dist[u] + cost", "", "                    if new_cost < dist[v]:", "                        dist[v] = new_cost", "", "            return dist[n - 1] <= k", "", "        ans = -1", "        left = 0", "        right = max_cost", "", "        while left <= right:", "            mid = (left + right) // 2", "", "            if can(mid):", "                ans = mid", "                left = mid + 1", "            else:", "                right = mid - 1", "", "        return ans"];
function build(){
  var T=LV.trace();
  var n=4, edges=[[0,1,5],[1,3,10],[0,2,4],[2,3,4]], online=[true,true,true,true], k=10;
  var maxCost=10;
  function GV(note,hot){ var m={};
    for(var i=0;i<n;i++) m[i]= (hot&&hot.indexOf(i)>=0)?'hot':'';
    return LV.arr('nodes 0…3', [0,1,2,3], m, {idx:false,
      note: note||'edges (u→v, cost): '+edges.map(function(e){return e[0]+'→'+e[1]+' ('+e[2]+')';}).join(',  ')+'   ·   budget k = 10'}); }

  T.step(20,'info','<b>Phase 1 — topological order.</b> Kahn’s algorithm: start from every node with in-degree 0 and peel them off. On a DAG this gives an order in which every edge points forwards, so a single sweep can compute shortest paths with no priority queue at all.',['n = <b>4</b>'],[GV(null,[0])]);
  var topo=[0,1,2,3];
  T.step(30,'push','Topological order: ['+topo.join(', ')+']. Computed ONCE and reused for every binary-search probe — that is what keeps the total cost down.',[],[GV(null,topo)]);

  T.step(66,'info','<b>Phase 2 — binary search on the ANSWER.</b> We want the largest x such that a path exists using only edges of cost ≥ x and total cost ≤ k. The predicate <code>can(x)</code> is <b>monotone</b>: if a path survives with every edge ≥ x, it also survives for any smaller threshold. Monotone predicate ⇒ binary search.',['left = 0','right = '+maxCost],[GV('searching for the largest feasible minimum edge score')]);

  var lo=0, hi=maxCost, ans=-1;
  function can(x){
    var INF=1e30, dist=[0,INF,INF,INF];
    topo.forEach(function(u){
      if(dist[u]===INF||dist[u]>k||!online[u]) return;
      edges.filter(function(e){ return e[0]===u; }).forEach(function(e){
        if(e[2]<x||!online[e[1]]) return;
        if(dist[u]+e[2]<dist[e[1]]) dist[e[1]]=dist[u]+e[2];
      });
    });
    return dist[n-1]<=k;
  }
  var guard=0;
  while(lo<=hi && guard++<12){
    var mid=Math.floor((lo+hi)/2);
    T.step(71,'call','left = '+lo+', right = '+hi+' → mid = <b>'+mid+'</b>. Ask: is there a path where every edge costs at least '+mid+', with total ≤ '+k+'?',['mid = <b>'+mid+'</b>','ans = <u>'+ans+'</u>'],[GV(null)]);
    var ok=can(mid);
    T.step(64, ok?'found':'bad','<code>can('+mid+')</code> = <b>'+ok+'</b>. The check is a linear DAG relaxation in topological order — <code>dist[v] = min(dist[v], dist[u] + cost)</code>, skipping offline nodes and edges cheaper than '+mid+'.',['can('+mid+') = <u>'+ok+'</u>'],[GV(ok?'feasible':'infeasible')]);
    if(ok){ ans=mid; lo=mid+1;
      T.step(74,'ok','Feasible — record ans = '+mid+' and try to do BETTER by searching the upper half: left = '+lo+'.',['ans = <u>'+ans+'</u>'],[GV(null)]);
      T.save('can('+mid+') = true → ans = '+mid);
    } else { hi=mid-1;
      T.step(77,'bad','Infeasible — '+mid+' is too demanding. Search lower: right = '+hi+'.',['ans = <u>'+ans+'</u>'],[GV(null)]);
    }
  }
  T.step(79,'done','Answer: <b>'+ans+'</b>. O(log(maxCost)) probes, each a linear O(V + E) DAG sweep.',['answer = <u>'+ans+'</u>'],[GV('done')]);
  return T;
}
LV.render({
  num:'3620', name:'Network Recovery Pathways', slug:'3620-network-recovery-pathways',
  difficulty:'Hard', pattern:'Binary search on the answer + DAG shortest path',
  url:'https://leetcode.com/problems/network-recovery-pathways',
  blurb:'The most transferable technique in competitive programming: when the answer is hard to compute but easy to <em>verify</em>, binary search it. Here each verification is a linear sweep over a topological order.',
  input:'n = 4, edges = [[0,1,5],[1,3,10],[0,2,4],[2,3,4]], k = 10', runName:'findMaxPathScore',
  skipLabel:'Skip to next feasible probe', skipTypes:['found'], emptyResult:'no feasible value yet',
  src:SRC, build:build,
  complexity:{time:'O((V + E) · log maxCost)', space:'O(V + E)'},
  theory:{
    idea:'<b>Binary search on the answer.</b> Instead of computing the optimum directly, guess a value x and ask a yes/no question: "is x achievable?" If <code>can(x)</code> is monotone — true for all x below the optimum and false above — binary search finds the boundary in O(log range) checks. The hard work moves into writing <code>can()</code>, which is usually a much simpler problem.',
    recognize:[
      '"Maximise the minimum" or "minimise the maximum" — the phrase is almost a guarantee.',
      'The answer lies in a known numeric range and checking a candidate is easier than optimising directly.',
      'On a <b>DAG</b>, shortest paths need no Dijkstra: relax edges in topological order and one linear sweep suffices — and it even works with negative weights.',
      'Companions in your repo: LC 1631 (minimise the maximum) and LC 2812 (maximise the minimum), both solvable this way as well as with a heap.'
    ],
    pitfalls:[
      '<b>Not verifying monotonicity.</b> If <code>can()</code> is not monotone, binary search returns nonsense. State the argument: raising the threshold only removes edges, so feasibility can only get worse.',
      '<b>Recomputing the topological order inside <code>can()</code>.</b> The DAG never changes — compute it once outside the loop.',
      '<b>The <code>ans = mid; left = mid + 1</code> pattern.</b> Because we want the LARGEST feasible value, record on success and keep pushing upward. Getting this direction backwards is the classic binary-search-on-answer bug.',
      '<b>Initialising <code>ans = -1</code>.</b> Necessary — nothing may be feasible at all.',
      '<b>Forgetting the offline-node and budget prunes</b> inside the relaxation; they are part of the feasibility definition, not optimisations.'
    ],
    template: "# binary search on the ANSWER - the search is always the same 10 lines\nlo, hi, ans = 0, MAX_POSSIBLE, -1\nwhile lo <= hi:\n    mid = (lo + hi) // 2\n    if can(mid):\n        ans = mid          # feasible -> record it and try HIGHER\n        lo  = mid + 1      # (minimising instead? record and go LOWER)\n    else:\n        hi  = mid - 1\nreturn ans\n\n# can() on a DAG: one linear sweep in topological order, no heap needed\n#   for u in topo:\n#       for v, w in graph[u]:\n#           dist[v] = min(dist[v], dist[u] + w)\n# monotonicity check: raising the threshold only REMOVES options -> monotone.\n",
    variants:[
      ['<b>Koko Eating Bananas</b> (LC 875)','Binary search the eating speed; <code>can()</code> is a sum of ceilings.'],
      ['<b>Split Array Largest Sum</b> (LC 410)','Binary search the largest allowed subarray sum; <code>can()</code> is a greedy split.'],
      ['<b>Path With Minimum Effort</b> (LC 1631)','Binary search the effort; <code>can()</code> is a BFS. Also in your repo.'],
      ['<b>Capacity to Ship Packages</b> (LC 1011)','Same shape with weights and days.'],
      ['Graph has cycles','Topological order does not exist — use Dijkstra inside <code>can()</code> instead.']
    ],
    thinking:'Whenever a problem asks for an optimum and you cannot see how to compute it, <b>flip it into a decision problem</b>: "given a candidate x, can I achieve it?" If that question is easier and its answer is monotone in x, you are done — binary search does the rest. This one reframing turns a large family of Hard problems into Medium ones, and the tell is almost always the phrase "maximise the minimum" or "minimise the maximum". Practise writing <code>can()</code> first and the search second; the search is always the same ten lines.'
  }
});

</script>
