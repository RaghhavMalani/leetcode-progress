<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dojo — active recall over your own solutions</title>
<link rel="stylesheet" href="_engine.css">
<link rel="stylesheet" href="_dojo.css">
</head>
<body>
<div class="dwrap">

  <div class="dbar">
    <div class="dlogo">RaghhavMalani / leetcode-progress<b>The Dojo</b></div>
    <div class="dstats">
      <div class="dstat hot"><b id="s-streak">0</b><span>day streak</span></div>
      <div class="dstat"><b id="s-due">0</b><span>due now</span></div>
      <div class="dstat good"><b id="s-mastery">0%</b><span>mastery</span></div>
      <div class="dstat"><b id="s-reps">0</b><span>reviews</span></div>
    </div>
  </div>

  <div class="dnav" id="nav"></div>
  <div id="screen"></div>

  <div class="fnav" style="margin-top:40px">
    <a href="./index.html">&#8592; traced solutions</a>
    <span class="tiny" id="storenote"></span>
    <a href="../PATTERNS.md">pattern handbook &#8594;</a>
  </div>
</div>

<script src="_engine.js"></script>
<script src="dojo-data.js"></script>
<script>
(function(){
"use strict";
var D = window.DOJO, P = D.problems, FAM = D.families;
var BY = {}; P.forEach(function(p){ BY[p.slug]=p; });

/* ============================================================
   storage — localStorage where available, memory otherwise,
   always exportable so progress is never trapped.
   ============================================================ */
var MEM = {}, HAS_LS = (function(){
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; } catch(e){ return false; }
})();
var KEY = 'dojo.v1';
function loadState(){
  try { var raw = HAS_LS ? localStorage.getItem(KEY) : MEM[KEY];
        return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function saveState(){
  var raw = JSON.stringify(ST);
  try { if (HAS_LS) localStorage.setItem(KEY, raw); else MEM[KEY]=raw; } catch(e){ MEM[KEY]=raw; }
}
var ST = loadState() || { rec:{}, streak:0, last:null, reps:0, hist:[] };
if (!ST.rec) ST.rec = {};
document.getElementById('storenote').textContent =
  HAS_LS ? 'progress saved in this browser' : 'browser storage blocked — use Export to keep progress';

/* ---- spaced repetition: level 0..5, interval in days ---- */
var GAP = [0, 1, 3, 7, 16, 35];
var DAY = 86400000;
function rec(slug){ return ST.rec[slug] || (ST.rec[slug] = {lvl:0, due:0, seen:0, right:0, wrong:0}); }
function grade(slug, correct){
  var r = rec(slug); r.seen++; ST.reps++;
  if (correct){ r.right++; r.lvl = Math.min(5, r.lvl+1); }
  else        { r.wrong++; r.lvl = Math.max(0, r.lvl-1); }
  r.due = Date.now() + GAP[r.lvl]*DAY;
  bumpStreak(); saveState(); paintStats();
}
function bumpStreak(){
  var today = new Date().toDateString();
  if (ST.last === today) return;
  var y = new Date(Date.now()-DAY).toDateString();
  ST.streak = (ST.last === y) ? ST.streak+1 : 1;
  ST.last = today;
}
function isDue(slug){ var r = ST.rec[slug]; return !r || r.due <= Date.now(); }
function masteryPct(){
  var t = 0; P.forEach(function(p){ t += (ST.rec[p.slug] ? ST.rec[p.slug].lvl : 0); });
  return Math.round(100*t/(P.length*5));
}
function paintStats(){
  document.getElementById('s-streak').textContent  = ST.streak;
  document.getElementById('s-due').textContent     = P.filter(function(p){ return isDue(p.slug); }).length;
  document.getElementById('s-mastery').textContent = masteryPct()+'%';
  document.getElementById('s-reps').textContent    = ST.reps;
}

/* ============================================================
   helpers
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return c==='&'?'&amp;':(c==='<'?'&lt;':'&gt;');}); }
function el(h){ var d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild; }
var SCREEN = document.getElementById('screen');
function show(h){ SCREEN.innerHTML = h; SCREEN.scrollIntoView({block:'start'}); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function codeHtml(src, hiLine, cls){
  return src.map(function(t,k){
    var on = (k+1)===hiLine;
    return '<div class="ln'+(on?' hi '+(cls||''):'')+'"><span class="no">'+(k+1)+'</span>'+
           (window.LV && LV.hl ? LV.hl(t) : esc(t))+'</div>';
  }).join('');
}
function pill(p){
  return '<span class="pill '+(p.difficulty||'').toLowerCase()+'">'+esc(p.difficulty||'')+'</span>';
}
function traceLink(p, label){
  return '<a href="./'+p.slug+'.html">'+(label||('watch '+p.num+' traced step by step'))+'</a>';
}

/* ============================================================
   the four drills.  each returns a question object:
     { slug, mode, render(host, done) }   done(correct)
   ============================================================ */

/* ---------- 1. RECOGNISE: statement -> which pattern family ---------- */
function qRecognise(p){
 return { slug:p.slug, mode:'recognise', title:'Name the pattern', render:function(done){
  var opts = FAM;
  show(
   '<div class="qcard">'+
     '<div class="qkicker"><span>drill &middot; pattern recognition</span>'+pill(p)+
       '<span class="pill">no title, no number</span><span class="timer" id="tmr"></span></div>'+
     '<div class="stmt">'+esc(p.prompt)+'</div>'+
     (p.constraints? '<div class="cons">Constraints\n'+esc(p.constraints)+'</div>':'')+
     '<div class="opts" id="o"></div>'+
     '<div id="fb"></div>'+
   '</div>');
  var t0=Date.now(), tick=setInterval(function(){
    var el2=document.getElementById('tmr'); if(!el2){ clearInterval(tick); return; }
    el2.textContent = ((Date.now()-t0)/1000).toFixed(0)+'s';
  }, 250);
  var box=document.getElementById('o');
  opts.forEach(function(f){
    var b=el('<button class="opt">'+esc(f)+'</button>');
    b.onclick=function(){
      clearInterval(tick);
      var ok = f===p.family;
      Array.prototype.forEach.call(box.children,function(c){
        c.disabled=true;
        if(c.textContent===p.family) c.className='opt right';
        else if(c===b) c.className='opt wrong';
        else c.className='opt muted';
      });
      document.getElementById('fb').innerHTML =
        '<div class="fb '+(ok?'right':'wrong')+'">'+
        (ok? '<b>Yes — '+esc(p.family)+'.</b>' : '<b>It is '+esc(p.family)+'</b>, not '+esc(f)+'.')+
        ' This is <b>'+p.num+'. '+esc(p.name)+'</b> &mdash; '+esc(p.pattern)+'.'+
        '<div class="why">'+esc(D.famdesc[p.family]||'')+'</div>'+
        '<div class="why">'+traceLink(p)+' &nbsp;&middot;&nbsp; <a href="../'+p.slug+'/NOTES.md">notes</a></div></div>';
      done(ok);
    };
    box.appendChild(b);
  });
 }};
}

/* ---------- 2. PREDICT: what does the code do next? ---------- */
function qPredict(p){
 var q = pick(p.predict);
 return { slug:p.slug, mode:'predict', title:'Predict the next step', render:function(done){
  show(
   '<div class="qcard">'+
     '<div class="qkicker"><span>drill &middot; predict the next step</span>'+pill(p)+
       '<span class="pill">'+p.num+'. '+esc(p.name)+'</span></div>'+
     '<div class="muted">Execution is paused on the highlighted line. <b>What happens next?</b></div>'+
     (q.vars&&q.vars.length? '<div class="vars" style="margin-top:12px">'+q.vars.map(function(v){return '<span>'+v+'</span>';}).join('')+'</div>':'')+
     '<div class="dcode" id="c"></div>'+
     '<div class="story">'+q.story.map(function(s){ return '<div>'+esc(s)+'</div>'; }).join('')+'</div>'+
     '<div class="opts wide" id="o"></div>'+
     '<div id="fb"></div>'+
   '</div>');
  var c=document.getElementById('c');
  c.innerHTML = codeHtml(p.src, q.line);
  var hi=c.querySelector('.ln.hi'); if(hi) hi.scrollIntoView({block:'center'});
  var box=document.getElementById('o');
  q.opts.forEach(function(o,i){
    var b=el('<button class="opt"><kbd>'+(i+1)+'</kbd>'+esc(o)+'</button>');
    b.onclick=function(){ answer(i); };
    box.appendChild(b);
  });
  function answer(i){
    var ok = i===q.ans;
    Array.prototype.forEach.call(box.children,function(c2,k){
      c2.disabled=true;
      c2.className = k===q.ans ? 'opt right' : (k===i ? 'opt wrong' : 'opt muted');
    });
    document.getElementById('fb').innerHTML =
      '<div class="fb '+(ok?'right':'wrong')+'"><b>'+(ok?'Correct.':'Not quite.')+'</b> '+
      esc(q.why)+'<div class="why">Execution moves to line '+q.nline+'. '+traceLink(p,'replay the whole trace')+'</div></div>';
    document.onkeydown=null;
    done(ok);
  }
  document.onkeydown=function(e){ var n=parseInt(e.key,10); if(n>=1&&n<=q.opts.length) answer(n-1); };
 }};
}

/* ---------- 3. REASSEMBLE: Parsons problem ---------- */
function qParsons(p){
 return { slug:p.slug, mode:'reassemble', title:'Rebuild the solution', render:function(done){
  var real = p.parsons;
  var bank = shuffle(real.map(function(x,i){ return {t:x.t, ind:x.ind, id:i}; }));
  var sol  = [], sel = -1, checked = false;
  show(
   '<div class="qcard">'+
     '<div class="qkicker"><span>drill &middot; rebuild from memory</span>'+pill(p)+
       '<span class="pill">'+p.num+'. '+esc(p.name)+'</span></div>'+
     '<div class="stmt small">'+esc(p.prompt.slice(0,420))+(p.prompt.length>420?'…':'')+'</div>'+
     '<div class="muted" style="margin-top:12px">Click lines from the bank in the right order, then set the '+
       'indentation with <b>&larr; &rarr;</b>. Blank lines and comments have been removed.</div>'+
     '<div class="parsons">'+
       '<div class="pcol"><h5>shuffled lines</h5><div id="bank"></div></div>'+
       '<div class="pcol"><h5>your solution</h5><div id="sol"></div>'+
         '<div class="ptools">'+
           '<button id="ind-l">&larr; outdent</button><button id="ind-r">indent &rarr;</button>'+
           '<button id="up">move up</button><button id="down">move down</button>'+
           '<button id="rm">remove</button></div></div>'+
     '</div>'+
     '<div class="rowbtns"><button class="bigbtn" id="chk">Check</button>'+
       '<button id="giveup">Show me</button></div>'+
     '<div id="fb"></div>'+
   '</div>');

  function draw(){
    var b=document.getElementById('bank'); b.innerHTML='';
    bank.forEach(function(x,i){
      var d=el('<div class="pline">'+esc(x.t)+'</div>');
      d.onclick=function(){ if(checked) return; sol.push(bank.splice(i,1)[0]); sel=sol.length-1; draw(); };
      b.appendChild(d);
    });
    if(!bank.length) b.innerHTML='<div class="muted" style="padding:6px">bank empty</div>';
    var s=document.getElementById('sol'); s.innerHTML='';
    sol.forEach(function(x,i){
      var d=el('<div class="pline'+(i===sel?' sel':'')+'"><span class="gut">'+
               '    '.repeat(x.ind)+'</span>'+esc(x.t)+'</div>');
      d.onclick=function(){ if(checked) return; sel=i; draw(); };
      s.appendChild(d);
    });
    if(!sol.length) s.innerHTML='<div class="muted" style="padding:6px">click lines on the left</div>';
  }
  function move(d){ if(sel<0||checked) return; var j=sel+d; if(j<0||j>=sol.length) return;
    var t=sol[sel]; sol[sel]=sol[j]; sol[j]=t; sel=j; draw(); }
  document.getElementById('ind-l').onclick=function(){ if(sel>=0&&!checked){ sol[sel].ind=Math.max(0,sol[sel].ind-1); draw(); } };
  document.getElementById('ind-r').onclick=function(){ if(sel>=0&&!checked){ sol[sel].ind=Math.min(6,sol[sel].ind+1); draw(); } };
  document.getElementById('up').onclick=function(){ move(-1); };
  document.getElementById('down').onclick=function(){ move(1); };
  document.getElementById('rm').onclick=function(){ if(sel>=0&&!checked){ bank.push(sol.splice(sel,1)[0]); sel=-1; draw(); } };
  document.onkeydown=function(e){
    if(checked) return;
    if(e.key==='ArrowLeft'){ document.getElementById('ind-l').click(); e.preventDefault(); }
    else if(e.key==='ArrowRight'){ document.getElementById('ind-r').click(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ move(-1); e.preventDefault(); }
    else if(e.key==='ArrowDown'){ move(1); e.preventDefault(); }
  };

  function finish(ok){
    checked=true; document.onkeydown=null;
    var s=document.getElementById('sol');
    Array.prototype.forEach.call(s.children,function(d,i){
      if(i>=real.length){ d.className='pline bad'; return; }
      d.className='pline '+((sol[i].t===real[i].t && sol[i].ind===real[i].ind)?'ok':'bad');
    });
    var wrong = real.filter(function(r,i){ return !sol[i] || sol[i].t!==r.t || sol[i].ind!==r.ind; }).length;
    document.getElementById('fb').innerHTML =
      '<div class="fb '+(ok?'right':'wrong')+'"><b>'+(ok?'Exactly right.':wrong+' line'+(wrong===1?'':'s')+' out of place.')+'</b> '+
      (ok? 'That is your solution, reconstructed from nothing but the problem statement.'
         : 'Green lines are correct, red are wrong or misindented. In Python the indentation <em>is</em> the control flow — getting it wrong is a real bug, not a formatting nit.')+
      '<div class="why">'+traceLink(p)+' &nbsp;&middot;&nbsp; <a href="../'+p.slug+'/NOTES.md">notes</a></div></div>';
    done(ok);
  }
  document.getElementById('chk').onclick=function(){
    if(checked) return;
    var ok = sol.length===real.length && real.every(function(r,i){ return sol[i].t===r.t && sol[i].ind===r.ind; });
    finish(ok);
  };
  document.getElementById('giveup').onclick=function(){
    if(checked) return;
    sol = real.map(function(r){ return {t:r.t, ind:r.ind}; }); bank=[]; sel=-1; draw(); finish(false);
  };
  draw();
 }};
}

/* ---------- 4. RECALL: blank slate, self-graded ---------- */
function qRecall(p){
 return { slug:p.slug, mode:'recall', title:'Write it from scratch', render:function(done){
  show(
   '<div class="qcard">'+
     '<div class="qkicker"><span>drill &middot; blank slate</span>'+pill(p)+
       '<span class="pill">'+esc(p.family)+'</span></div>'+
     '<div class="stmt">'+esc(p.prompt)+'</div>'+
     (p.example? '<div class="cons">'+esc(p.example)+'</div>':'')+
     '<div class="muted" style="margin-top:16px">Write the solution — on paper, in an editor, or out loud. '+
       'Do not scroll past this until you have committed to an approach. Then grade yourself honestly.</div>'+
     '<div class="opts" id="o">'+
       '<button class="opt" data-g="0">I could not start</button>'+
       '<button class="opt" data-g="0">Right idea, wrong details</button>'+
       '<button class="opt" data-g="1">Wrote it, with a stumble</button>'+
       '<button class="opt" data-g="1">Clean, first try</button>'+
     '</div>'+
     '<div id="fb"></div>'+
   '</div>');
  var box=document.getElementById('o');
  Array.prototype.forEach.call(box.children,function(b){
    b.onclick=function(){
      var ok = b.dataset.g==='1';
      Array.prototype.forEach.call(box.children,function(c){ c.disabled=true; c.className='opt muted'; });
      b.className='opt '+(ok?'right':'wrong');
      document.getElementById('fb').innerHTML =
        '<div class="fb '+(ok?'right':'wrong')+'"><b>'+esc(p.pattern)+'</b> — here is what you wrote before:'+
        '<div class="dcode" style="margin-top:10px;max-height:300px">'+codeHtml(p.src,-1)+'</div>'+
        '<div class="why">'+traceLink(p)+' &nbsp;&middot;&nbsp; <a href="../'+p.slug+'/NOTES.md">notes</a></div></div>';
      done(ok);
    };
  });
 }};
}


/* ---------- 5. TEMPLATE: rebuild a family skeleton from memory ---------- */
function qTemplate(fam){
 var T = D.templates[fam];
 return { slug:'tmpl:'+fam, mode:'template', title:'Rebuild the skeleton', render:function(done){
  var real = T.tmpl.split('\n').filter(function(l){ return l.trim(); })
                   .map(function(l){ return {t:l.trim(), ind:Math.floor((l.length-l.replace(/^ +/,'').length)/4)}; });
  var bank = shuffle(real.map(function(x){ return {t:x.t, ind:0}; }));
  var sol=[], sel=-1, checked=false;
  show(
   '<div class="qcard">'+
     '<div class="qkicker"><span>drill &middot; the skeleton itself</span>'+
       '<span class="pill">'+esc(fam)+'</span></div>'+
     '<div class="muted">This is the shape behind every problem in the family. Not one problem &mdash; the '+
       '<b>pattern</b>. If you can rebuild this from nothing, you can derive the problems.</div>'+
     '<div class="cons" style="margin-top:12px">'+esc(D.famdesc[fam]||'')+'</div>'+
     '<div class="parsons">'+
       '<div class="pcol"><h5>shuffled</h5><div id="bank"></div></div>'+
       '<div class="pcol"><h5>the skeleton</h5><div id="sol"></div>'+
         '<div class="ptools"><button id="ind-l">&larr;</button><button id="ind-r">&rarr;</button>'+
         '<button id="up">up</button><button id="down">down</button><button id="rm">remove</button></div></div>'+
     '</div>'+
     '<div class="rowbtns"><button class="bigbtn" id="chk">Check</button><button id="giveup">Show me</button></div>'+
     '<div id="fb"></div>'+
   '</div>');
  function draw(){
    var b=document.getElementById('bank'); b.innerHTML='';
    bank.forEach(function(x,i){
      var d=el('<div class="pline">'+esc(x.t)+'</div>');
      d.onclick=function(){ if(checked)return; sol.push(bank.splice(i,1)[0]); sel=sol.length-1; draw(); };
      b.appendChild(d);
    });
    if(!bank.length) b.innerHTML='<div class="muted" style="padding:6px">bank empty</div>';
    var s2=document.getElementById('sol'); s2.innerHTML='';
    sol.forEach(function(x,i){
      var d=el('<div class="pline'+(i===sel?' sel':'')+'"><span class="gut">'+'    '.repeat(x.ind)+'</span>'+esc(x.t)+'</div>');
      d.onclick=function(){ if(checked)return; sel=i; draw(); };
      s2.appendChild(d);
    });
    if(!sol.length) s2.innerHTML='<div class="muted" style="padding:6px">click lines on the left</div>';
  }
  function move(d){ if(sel<0||checked)return; var j=sel+d; if(j<0||j>=sol.length)return;
    var t=sol[sel]; sol[sel]=sol[j]; sol[j]=t; sel=j; draw(); }
  document.getElementById('ind-l').onclick=function(){ if(sel>=0&&!checked){ sol[sel].ind=Math.max(0,sol[sel].ind-1); draw(); } };
  document.getElementById('ind-r').onclick=function(){ if(sel>=0&&!checked){ sol[sel].ind=Math.min(6,sol[sel].ind+1); draw(); } };
  document.getElementById('up').onclick=function(){ move(-1); };
  document.getElementById('down').onclick=function(){ move(1); };
  document.getElementById('rm').onclick=function(){ if(sel>=0&&!checked){ bank.push(sol.splice(sel,1)[0]); sel=-1; draw(); } };
  function finish(ok){
    checked=true;
    var s2=document.getElementById('sol');
    Array.prototype.forEach.call(s2.children,function(d,i){
      d.className='pline '+((real[i]&&sol[i]&&sol[i].t===real[i].t&&sol[i].ind===real[i].ind)?'ok':'bad');
    });
    document.getElementById('fb').innerHTML='<div class="fb '+(ok?'right':'wrong')+'"><b>'+
      (ok?'Exactly.':'Not yet.')+'</b> The canonical version lives in <a href="../PATTERNS.md">PATTERNS.md</a>, '+
      'taken from <a href="./'+T.slug+'.html">'+esc(T.from)+'</a>.'+
      '<div class="dcode" style="margin-top:10px">'+
        real.map(function(r){ return '<div class="ln"><span class="no"></span>'+
          (window.LV&&LV.hl?LV.hl('    '.repeat(r.ind)+r.t):esc(r.t))+'</div>'; }).join('')+
      '</div></div>';
    done(ok);
  }
  document.getElementById('chk').onclick=function(){
    if(checked)return;
    finish(sol.length===real.length && real.every(function(r,i){ return sol[i].t===r.t && sol[i].ind===r.ind; }));
  };
  document.getElementById('giveup').onclick=function(){
    if(checked)return; sol=real.map(function(r){ return {t:r.t,ind:r.ind}; }); bank=[]; draw(); finish(false);
  };
  draw();
 }};
}

/* ---------- failure-mode tagging: WHAT kind of mistake was it? ---------- */
var MISTAKES = [
  'Misread the problem',
  'Picked the wrong pattern',
  'Off-by-one or a boundary case',
  'Forgot to copy / forgot to undo state',
  'Wrong order of operations',
  'Just could not remember it'
];
function tagMiss(host, slug){
  if (!ST.miss) ST.miss = {};
  var box = el('<div class="qz" style="border-left-color:var(--rd);border-color:#7a3b40">'+
    '<h6 style="color:var(--rd)">What actually went wrong?</h6>'+
    '<div class="qzopts">'+MISTAKES.map(function(m,i){
      return '<button data-m="'+i+'">'+esc(m)+'</button>'; }).join('')+'</div>'+
    '<div class="qzfb" style="color:var(--ink-3)">Tagging this is what lets the dojo spot the mistake you keep making.</div></div>');
  host.appendChild(box);
  Array.prototype.forEach.call(box.querySelectorAll('button'), function(b){
    b.onclick=function(){
      var m = MISTAKES[+b.dataset.m];
      ST.miss[m] = (ST.miss[m]||0)+1;
      if (!ST.missBy) ST.missBy = {};
      (ST.missBy[m] = ST.missBy[m] || []).push(slug);
      if (ST.missBy[m].length > 40) ST.missBy[m].shift();
      saveState();
      Array.prototype.forEach.call(box.querySelectorAll('button'), function(c){
        c.disabled=true; c.className = (c===b)?'wrong':'muted';
      });
      box.querySelector('.qzfb').innerHTML = 'Logged. You have tagged this <b>'+ST.miss[m]+'</b> time'+
        (ST.miss[m]===1?'':'s')+'.';
    };
  });
}

/* ---------- 6. INTERVIEW: one problem, 45 minutes, five phases ---------- */
var PHASES = [
  {n:'Clarify',  m:2,  p:['Restate the problem in your own words.','What are the input sizes? What does that imply about the target complexity?','Edge cases: empty, one element, duplicates, negatives?','Can I modify the input? Is it sorted?']},
  {n:'Approach', m:5,  p:['Name the pattern family out loud.','State the brute force and its cost.','State your approach and why it is better.','Say the complexity BEFORE you write anything.']},
  {n:'Code',     m:20, p:['Write it. Talk while you type.','Name variables so the invariant is obvious.','Do not silently fix bugs — say what you are fixing.']},
  {n:'Test',     m:10, p:['Walk a small example line by line.','Now the edge cases you listed in phase one.','Off-by-one: check the first and last iteration explicitly.']},
  {n:'Optimise', m:8,  p:['Can the space come down? Rolling variables, in-place, two pointers?','Is there a better complexity class?','What would you change if the input were 1000x bigger?']}
];
function runInterview(){
  var p = choose(1)[0], ph = 0, left = PHASES[0].m*60, timer = null, paused = false;
  function render(){
    var P0 = PHASES[ph];
    show('<div class="qcard">'+
      '<div class="qkicker"><span>interview &middot; phase '+(ph+1)+' of 5</span>'+pill(p)+
        '<span class="pill">'+esc(P0.n)+'</span>'+
        '<span class="timer" id="clk" style="font-size:17px"></span></div>'+
      '<div class="stmt">'+esc(p.prompt)+'</div>'+
      (p.constraints?'<div class="cons">Constraints\n'+esc(p.constraints)+'</div>':'')+
      '<div class="qz" style="margin-top:16px"><h6>'+esc(P0.n)+' &mdash; '+P0.m+' minutes</h6>'+
        '<ul style="margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px;line-height:1.75">'+
        P0.p.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>'+
      '<div class="rowbtns">'+
        '<button class="bigbtn" id="nextph">'+(ph<4?'Next phase &rarr;':'Finish &rarr;')+'</button>'+
        '<button id="pause">Pause</button>'+
        '<span class="muted">no solution is shown until the end &mdash; that is the point</span>'+
      '</div></div>');
    document.getElementById('nextph').onclick=function(){
      if(ph<4){ ph++; left=PHASES[ph].m*60; render(); } else { clearInterval(timer); finish(); }
    };
    document.getElementById('pause').onclick=function(){
      paused=!paused; this.textContent=paused?'Resume':'Pause';
    };
    tick();
  }
  function tick(){
    var c=document.getElementById('clk'); if(!c) return;
    var m=Math.floor(Math.abs(left)/60), s=Math.abs(left)%60;
    c.textContent=(left<0?'+':'')+m+':'+(s<10?'0':'')+s;
    c.style.color = left<0 ? 'var(--rd)' : (left<30 ? 'var(--am)' : 'var(--ink-2)');
  }
  clearInterval(timer);
  timer=setInterval(function(){ if(!paused){ left--; tick(); } }, 1000);
  function finish(){
    show('<div class="qcard">'+
      '<div class="qkicker"><span>interview &middot; debrief</span>'+pill(p)+'</div>'+
      '<h2 style="margin:0 0 4px;font-size:18px">'+p.num+'. '+esc(p.name)+'</h2>'+
      '<div class="muted" style="margin-bottom:14px">'+esc(p.pattern)+' &middot; '+esc(p.family)+'</div>'+
      '<div class="dcode">'+codeHtml(p.src,-1)+'</div>'+
      '<div class="muted" style="margin-top:14px">How did that go?</div>'+
      '<div class="opts" id="o">'+
        '<button class="opt" data-g="0">Never got a working approach</button>'+
        '<button class="opt" data-g="0">Got there, but slowly / with help</button>'+
        '<button class="opt" data-g="1">Clean, within time</button>'+
        '<button class="opt" data-g="1">Clean, and I optimised it</button>'+
      '</div><div id="fb"></div></div>');
    var box=document.getElementById('o');
    Array.prototype.forEach.call(box.children,function(b){
      b.onclick=function(){
        var ok=b.dataset.g==='1';
        Array.prototype.forEach.call(box.children,function(c){ c.disabled=true; c.className='opt muted'; });
        b.className='opt '+(ok?'right':'wrong');
        grade(p.slug, ok);
        document.getElementById('fb').innerHTML='<div class="fb '+(ok?'right':'wrong')+'">'+
          traceLink(p,'Watch it run')+' &nbsp;&middot;&nbsp; <a href="../'+p.slug+'/NOTES.md">read the notes</a>'+
          ' &nbsp;&middot;&nbsp; <a href="../PATTERNS.md">'+esc(p.family)+' in the handbook</a></div>';
        if(!ok) tagMiss(SCREEN.querySelector('.qcard'), p.slug);
      };
    });
  }
  render();
}

/* ============================================================
   question factory
   ============================================================ */
var MODES = {
  recognise: {label:'Recognise', make:qRecognise, ok:function(p){ return !!p.prompt; }},
  predict:   {label:'Predict',   make:qPredict,   ok:function(p){ return p.predict && p.predict.length; }},
  reassemble:{label:'Reassemble',make:qParsons,   ok:function(p){ return !!p.parsons; }},
  recall:    {label:'Recall',    make:qRecall,    ok:function(p){ return !!p.prompt; }}
};
function makeQ(p, mode){
  var ms = mode ? [mode] : shuffle(Object.keys(MODES));
  for (var i=0;i<ms.length;i++) if (MODES[ms[i]].ok(p)) return MODES[ms[i]].make(p);
  return qRecognise(p);
}

/* pick n problems: due first, then weakest families, then random */
function choose(n, filter){
  var pool = P.filter(filter || function(){ return true; });
  var famLvl = {};
  FAM.forEach(function(f){
    var rows = P.filter(function(p){ return p.family===f; });
    var t = rows.reduce(function(s,p){ return s + (ST.rec[p.slug]?ST.rec[p.slug].lvl:0); },0);
    famLvl[f] = rows.length ? t/rows.length : 0;
  });
  var scored = pool.map(function(p){
    var r = ST.rec[p.slug] || {lvl:0,due:0};
    var overdue = Math.max(0, (Date.now()-r.due)/DAY);
    return {p:p, s: (isDue(p.slug)?100:0) + Math.min(60, overdue*4) + (5-r.lvl)*8 + (5-famLvl[p.family])*3 + Math.random()*14};
  });
  scored.sort(function(a,b){ return b.s-a.s; });
  return scored.slice(0, n).map(function(x){ return x.p; });
}

/* ============================================================
   session runner
   ============================================================ */
var SESH = null;
function runSession(items, opts){
  opts = opts || {};
  SESH = {items:items, i:0, right:0, misses:[], boss:!!opts.boss, t0:Date.now(), marks:[]};
  nextQ();
}
function nextQ(){
  if (SESH.i >= SESH.items.length) return summary();
  var it = SESH.items[SESH.i];
  var q = it.q;
  q.render(function(correct){
    SESH.marks[SESH.i] = correct;
    if (correct) SESH.right++; else SESH.misses.push(BY[q.slug]);
    grade(q.slug, correct);
    var host = SCREEN.querySelector('.qcard');
    if (!correct && q.slug.indexOf('tmpl:') !== 0) tagMiss(host, q.slug);
    var b = el('<div class="rowbtns"><button class="bigbtn" id="nx">'+
               (SESH.i+1 >= SESH.items.length ? 'Finish' : 'Next &rarr;')+'</button>'+
               '<span class="muted">or press <b>Enter</b></span></div>');
    host.appendChild(b);
    function go(){ document.onkeydown=null; SESH.i++; nextQ(); }
    document.getElementById('nx').onclick=go;
    document.onkeydown=function(e){ if(e.key==='Enter'){ go(); } };
    document.getElementById('nx').focus();
  });
  paintProgress();
}
function paintProgress(){
  var bar = SCREEN.querySelector('.prog');
  if (!bar){ bar = el('<div class="prog"></div>'); SCREEN.insertBefore(bar, SCREEN.firstChild); }
  bar.innerHTML = SESH.items.map(function(_,k){
    return '<i class="'+(k<SESH.i ? (SESH.marks[k]?'done':'miss') : (k===SESH.i?'cur':''))+'"></i>';
  }).join('');
}
function summary(){
  var n=SESH.items.length, pc=Math.round(100*SESH.right/n);
  var secs=Math.round((Date.now()-SESH.t0)/1000);
  var rank = pc===100?'FLAWLESS':pc>=80?'SHARP':pc>=60?'SOLID':pc>=40?'RUSTY':'BACK TO THE TRACES';
  show('<div class="qcard summary">'+
    '<div class="score">'+SESH.right+'/'+n+'</div>'+
    '<div class="rank">'+rank+'</div>'+
    '<p>'+secs+' seconds &middot; '+SESH.items.length+' items across '+
      (new Set(SESH.items.map(function(i){ return BY[i.q.slug].family; }))).size+' pattern families. '+
      'Everything you missed is now due for review again.</p>'+
    (SESH.misses.length? '<div class="misslist"><div class="muted" style="margin-bottom:8px">Go and re-read these:</div>'+
      SESH.misses.map(function(p){ return '<a href="./'+p.slug+'.html">'+p.num+'. '+esc(p.name)+
        ' &nbsp;·&nbsp; '+esc(p.pattern)+'</a>'; }).join('')+'</div>':'')+
    '<div class="rowbtns" style="justify-content:center">'+
      '<button class="bigbtn" id="again">Another session</button>'+
      '<button id="home2">Back to the dojo</button></div>'+
  '</div>');
  document.getElementById('again').onclick=function(){ startDaily(); };
  document.getElementById('home2').onclick=function(){ go('home'); };
  ST.hist.push({t:Date.now(), n:n, right:SESH.right}); if(ST.hist.length>200) ST.hist.shift();
  saveState(); paintStats();
}

/* ============================================================
   screens
   ============================================================ */
function startDaily(){
  var ps = choose(12);
  runSession(ps.map(function(p){ return {q:makeQ(p)}; }));
}
function startMode(mode){
  var ps = choose(10, MODES[mode].ok);
  runSession(ps.map(function(p){ return {q:makeQ(p, mode)}; }));
}
function startTemplates(){
  var fams = shuffle(Object.keys(D.templates)).slice(0, 8);
  runSession(fams.map(function(f){ return {q: qTemplate(f)}; }));
}
function startBoss(){
  var ps = choose(15);
  runSession(ps.map(function(p){ return {q:makeQ(p)}; }), {boss:true});
}
function startFamily(f){
  var ps = choose(10, function(p){ return p.family===f; });
  runSession(ps.map(function(p){ return {q:makeQ(p)}; }));
}


function missPanel(){
  var m = ST.miss || {};
  var rows = Object.keys(m).sort(function(a,b){ return m[b]-m[a]; });
  if (!rows.length) return '';
  var total = rows.reduce(function(s,k){ return s+m[k]; },0);
  return '<div class="qcard">'+
    '<div class="qkicker"><span>the mistakes you keep making</span>'+
      '<span class="pill">'+total+' tagged</span></div>'+
    rows.map(function(k){
      var pc = Math.round(100*m[k]/total);
      return '<div class="fbar'+(pc>=30?' weak':'')+'"><div class="lab">'+esc(k)+'</div>'+
             '<div class="track"><div class="fill" style="width:'+pc+'%;background:'+
             (pc>=30?'linear-gradient(90deg,#7a3b40,#e0686e)':'linear-gradient(90deg,#1d6f8f,#2fc389)')+
             '"></div></div><div class="val">'+m[k]+'&times;</div></div>';
    }).join('')+
    '<div class="muted" style="margin-top:12px">'+
      (rows.length && m[rows[0]] >= 3
        ? 'Your most common failure is <b>'+esc(rows[0])+'</b>. That is a habit, not bad luck &mdash; '+
          'next time you sit down, check for it deliberately before you call a solution finished.'
        : 'Keep tagging your misses. After a couple of weeks this tells you what to actually fix.')+
    '</div></div>';
}

function home(){
  var due = P.filter(function(p){ return isDue(p.slug); }).length;
  var famRows = FAM.map(function(f){
    var rows = P.filter(function(p){ return p.family===f; });
    if(!rows.length) return '';
    var t = rows.reduce(function(s,p){ return s+(ST.rec[p.slug]?ST.rec[p.slug].lvl:0); },0);
    var pc = Math.round(100*t/(rows.length*5));
    var weak = rows.length<=4;
    return '<div class="fbar'+(weak?' weak':'')+'"><div class="lab">'+esc(f)+(weak?' &middot; thin':'')+'</div>'+
           '<div class="track"><div class="fill" style="width:'+pc+'%"></div></div>'+
           '<div class="val">'+pc+'% &middot; '+rows.length+'</div></div>';
  }).join('');
  var heat = FAM.map(function(f){
    var rows = P.filter(function(p){ return p.family===f; });
    if(!rows.length) return '';
    return '<div class="heatrow"><div class="hname">'+esc(f)+'</div><div class="heat">'+
      rows.map(function(p){
        var r=ST.rec[p.slug]; var lvl=r?r.lvl:0;
        return '<a class="hcell l'+lvl+(isDue(p.slug)&&lvl>0?' due':'')+'" href="./'+p.slug+'.html" '+
               'title="'+esc(p.num+'. '+p.name+'  —  level '+lvl+'/5')+'"></a>';
      }).join('')+'</div></div>';
  }).join('');

  show(
   '<div class="hero2">'+
     '<h2>'+(due? due+' problems are due for review' : 'Nothing is due — go build a streak anyway')+'</h2>'+
     '<p>Twelve items, interleaved across families on purpose. Mixing patterns feels harder than drilling one at a '+
       'time and is the reason it works: in an interview nobody tells you which family the problem belongs to.</p>'+
     '<div class="rowbtns">'+
       '<button class="bigbtn" id="daily">Start today\'s session &rarr;</button>'+
       '<button class="bigbtn alt" id="boss">Boss fight &middot; 15 mixed</button>'+
       '<button id="interview">Interview simulation &middot; 45 min</button>'+
     '</div>'+
   '</div>'+

   '<div class="qcard">'+
     '<div class="qkicker"><span>drills</span></div>'+
     '<div class="opts">'+
       '<button class="opt" data-m="recognise"><b>Recognise</b><br><span class="muted">A real problem statement with the title stripped. Name the pattern family. This is the skill that decides whether you solve it at all.</span></button>'+
       '<button class="opt" data-m="predict"><b>Predict</b><br><span class="muted">Execution paused mid-trace. What does your code do next — push, pop, prune, record?</span></button>'+
       '<button class="opt" data-m="reassemble"><b>Reassemble</b><br><span class="muted">Your own solution, shuffled line by line. Put it back together, indentation included.</span></button>'+
       '<button class="opt" data-m="recall"><b>Recall</b><br><span class="muted">Blank slate. Statement only, code hidden. Write it, then grade yourself.</span></button>'+
       '<button class="opt" id="tmplbtn"><b>Skeletons</b><br><span class="muted">Rebuild the pattern itself, not a problem. Sixteen templates, the densest thing in the repo.</span></button>'+
       '<button class="opt" id="ivbtn"><b>Interview</b><br><span class="muted">One problem, 45 minutes, five timed phases. Practises the format, not the algorithm.</span></button>'+
     '</div>'+
   '</div>'+
   missPanel()+

   '<div class="qcard">'+
     '<div class="qkicker"><span>mastery map</span><span class="pill">'+masteryPct()+'% overall</span></div>'+
     heat+
     '<div class="heatlegend"><span>level</span>'+
       [0,1,2,3,4,5].map(function(l){ return '<span><i class="hcell l'+l+'" style="cursor:default"></i> '+l+'</span>'; }).join('')+
       '<span><i class="hcell l3 due" style="cursor:default"></i> due for review</span>'+
       '<span style="margin-left:auto">click any cell to open its trace</span></div>'+
   '</div>'+

   '<div class="qcard">'+
     '<div class="qkicker"><span>coverage by family</span><span class="pill">click to drill one</span></div>'+
     '<div id="fams">'+famRows+'</div>'+
     '<div class="muted" style="margin-top:12px">Families marked <b>thin</b> have four problems or fewer. '+
       'Those are the gaps worth filling next &mdash; see <a href="../STUDY-PLAN.md">STUDY-PLAN.md</a>.</div>'+
   '</div>'+

   '<div class="qcard">'+
     '<div class="qkicker"><span>your progress</span></div>'+
     '<div class="rowbtns">'+
       '<button id="exp">Export progress</button>'+
       '<button id="imp">Import progress</button>'+
       '<button id="reset">Reset everything</button>'+
       '<span class="muted">'+ST.reps+' reviews &middot; '+Object.keys(ST.rec).length+' problems touched</span>'+
     '</div>'+
   '</div>');

  document.getElementById('daily').onclick=startDaily;
  document.getElementById('boss').onclick=startBoss;
  document.getElementById('interview').onclick=runInterview;
  document.getElementById('tmplbtn').onclick=startTemplates;
  document.getElementById('ivbtn').onclick=runInterview;
  SCREEN.querySelectorAll('.opt[data-m]').forEach(function(b){
    b.onclick=function(){ startMode(b.dataset.m); };
  });
  SCREEN.querySelectorAll('.fbar').forEach(function(row){
    row.style.cursor='pointer';
    row.onclick=function(){ startFamily(row.querySelector('.lab').textContent.replace(' · thin','')); };
  });
  document.getElementById('exp').onclick=function(){
    var blob=new Blob([JSON.stringify(ST,null,1)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='dojo-progress.json'; a.click();
  };
  document.getElementById('imp').onclick=function(){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
    inp.onchange=function(){ var f=inp.files[0]; if(!f) return;
      var r=new FileReader(); r.onload=function(){ try{ ST=JSON.parse(r.result); saveState(); paintStats(); home(); }catch(e){ alert('Could not read that file.'); } };
      r.readAsText(f); };
    inp.click();
  };
  document.getElementById('reset').onclick=function(){
    if(confirm('Erase all progress, levels and streak?')){ ST={rec:{},streak:0,last:null,reps:0,hist:[]}; saveState(); paintStats(); home(); }
  };
}

/* ---------- nav ---------- */
var TABS=[['home','Dojo'],['daily','Today'],['recognise','Recognise'],['predict','Predict'],
          ['reassemble','Reassemble'],['recall','Recall'],['template','Skeletons'],
          ['interview','Interview'],['boss','Boss fight']];
function go(t){
  document.onkeydown=null;
  document.querySelectorAll('#nav button').forEach(function(b){ b.className = b.dataset.t===t?'on':''; });
  if(t==='home') home();
  else if(t==='daily') startDaily();
  else if(t==='boss') startBoss();
  else if(t==='template') startTemplates();
  else if(t==='interview') runInterview();
  else startMode(t);
}
var nav=document.getElementById('nav');
TABS.forEach(function(t){
  var b=el('<button data-t="'+t[0]+'">'+t[1]+'</button>');
  b.onclick=function(){ go(t[0]); }; nav.appendChild(b);
});

paintStats();
go('home');
})();
</script>
