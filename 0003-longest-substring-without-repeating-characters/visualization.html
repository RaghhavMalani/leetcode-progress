<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 - Longest Substring Without Repeating Characters</title>
<link rel="stylesheet" href="../visualizations/_engine.css">
</head>
<body>
<script src="../visualizations/_engine.js"></script>
<script>

var SRC = ["class Solution(object):", "    def lengthOfLongestSubstring(self, s):", "        \"\"\"", "        :type s: str", "        :rtype: int", "        \"\"\"", "        ", "        s1 = set()", "        l = 0 ", "        res = 0", "", "        for r in range(len(s)):", "            while s[r] in s1:", "                s1.remove(s[l])", "                l = l + 1", "            ", "            s1.add(s[r])", "            res = max(res, r - l + 1)", "", "        return res"];
function build(){
  var T=LV.trace(), s='abcabcbb', win={}, l=0, res=0;
  function keys(){ return Object.keys(win); }
  function marks(r,hot){ var m={};
    for(var x=0;x<s.length;x++){
      if(x>r) m[x]='dim';
      else if(x>=l && x<=r) m[x]= (x===r&&hot)?'hot':'win';
      else m[x]='';
    }
    return m; }
  function ptrs(r){ var p={}; p[l]=(l===r?'l r':'l'); if(r!==l) p[r]='r'; return p; }
  function V(r,hot){ return [
    LV.arr('s — blue block is the current window', s.split(''), marks(r,hot), {ptrs:ptrs(r)}),
    LV.kv('s1 — the set of characters inside the window', keys(), {}, {emptyText:'empty'}) ]; }
  function VA(r){ return ['l = <b>'+l+'</b>','r = <i>'+r+'</i>','window length = <em>'+(r-l+1)+'</em>','res = <u>'+res+'</u>']; }

  T.step(8,'info','Three pieces of state: a set of what is currently in the window, the left edge `l`, and the best length seen. The window is always the half-open stretch s[l..r].',['l = <b>0</b>','res = <u>0</u>'],[LV.arr('s', s.split(''), {}, {}), LV.kv('s1', [], {}, {emptyText:'empty'})]);

  for(var r=0;r<s.length;r++){
    T.step(12,'call','r = '+r+'. The window grows to the right; the incoming character is "'+s[r]+'".',VA(r),V(r,true));
    while(win[s[r]]){
      var gone=s[l];
      T.step(13,'bad','"'+s[r]+'" is already inside the window, so the window is invalid. Shrink from the LEFT until the duplicate is gone.',VA(r),V(r,true));
      delete win[gone]; l++;
      T.step(15,'pop','Removed "'+gone+'" and advanced l to '+l+'. Note l only ever moves forward — that is why the whole thing is O(n) and not O(n²).',VA(r),V(r,true));
    }
    win[s[r]]=1;
    T.step(17,'push','The window is legal again. Add "'+s[r]+'" to the set.',VA(r),V(r,false));
    var len=r-l+1, old=res; res=Math.max(res,len);
    T.step(18, res>old?'ok':'info','Window s['+l+'..'+r+'] = "'+s.slice(l,r+1)+'" has length '+len+'. '+(res>old?'New best: res = '+res+'.':'Not better than '+res+'.'),VA(r),V(r,false));
    if(res>old){ T.save('"'+s.slice(l,r+1)+'" → '+res); }
  }
  T.step(20,'done','Answer: <b>'+res+'</b>. Each of l and r walked the string exactly once — two pointers, 2n moves total, O(n).',['res = <u>'+res+'</u>'],V(s.length-1,false));
  return T;
}
LV.render({
  num:'3', name:'Longest Substring Without Repeating Characters', slug:'0003-longest-substring-without-repeating-characters',
  difficulty:'Medium', pattern:'Sliding window · variable size',
  url:'https://leetcode.com/problems/longest-substring-without-repeating-characters',
  blurb:'The reference implementation for variable-size sliding windows. Grow on the right, shrink on the left until the window is legal again, record. Neither pointer ever goes backwards.',
  input:'s = "abcabcbb"', runName:'lengthOfLongestSubstring',
  skipLabel:'Skip to next record', skipTypes:['ok'], emptyResult:'no record yet',
  src:SRC, build:build,
  complexity:{time:'O(n) — l and r each advance at most n times', space:'O(min(n, alphabet))'},
  theory:{
    idea:'A sliding window is two pointers that <b>only ever move right</b>. The outer loop grows the window; an inner <code>while</code> shrinks it back to legality. Because neither pointer rewinds, the inner loop is not a nested O(n) — the total work is amortised to 2n. If you ever find yourself resetting <code>l</code> back to <code>r</code>, or restarting a scan, you have left the pattern and gone quadratic.',
    recognize:[
      '<b>Contiguous</b> subarray or substring — the word "substring" or "subarray" (not "subsequence") is the single strongest signal.',
      'Asking for the <b>longest / shortest / count</b> of stretches satisfying some property.',
      'The property is <b>monotone</b>: if a window is invalid, growing it right cannot fix it — only shrinking from the left can. That is what licenses the pattern.',
      'Contrast: "subsequence" means elements need not be adjacent, which kills sliding window and usually means DP.'
    ],
    pitfalls:[
      '<b><code>s1.remove(s[r])</code> instead of <code>s1.remove(s[l])</code>.</b> You must evict from the left edge, not the character that caused the collision.',
      '<b>Using <code>if</code> instead of <code>while</code>.</b> One eviction is not always enough — you shrink until the window is legal, however many steps that takes.',
      '<b>Recording the answer inside the while loop.</b> Measure only after the window is valid again.',
      '<b>Off-by-one in the length.</b> An inclusive window s[l..r] has length <code>r - l + 1</code>. Write it out rather than trusting instinct.',
      '<b>Jumping <code>l</code> straight past the duplicate</b> using a last-seen map is a valid faster variant — but then you must guard <code>l = max(l, last[c] + 1)</code>, or a stale index drags l backwards.'
    ],
    template: "# Variable-size sliding window - the universal shape\nleft = 0\nfor right in range(len(s)):\n    add(s[right])                       # 1. grow\n\n    while window_is_invalid():          # 2. shrink until legal again\n        remove(s[left])\n        left += 1\n\n    ans = best(ans, right - left + 1)   # 3. record\n\n# \"Count substrings\" variant: when the window at `right` is the SMALLEST\n# valid one, every extension of it is also valid, so add (n - right).\n",
    variants:[
      ['At most k distinct characters','LC 340 — swap the set for a counter, invalid when <code>len(counter) &gt; k</code>.'],
      ['Longest repeating character replacement','LC 424 — invalid when <code>window_len - max_freq &gt; k</code>.'],
      ['<b>Minimum</b> window substring','LC 76 — record inside the shrink loop instead of after it; you want the smallest valid window, not the largest.'],
      ['Fixed-size window of length k','No while loop at all — add s[r], remove s[r-k], record. Strictly simpler.'],
      ['Count substrings with the property','LC 1358 — add <code>n - right</code> per valid window. See that page.']
    ],
    thinking:'Every sliding-window problem is three questions. <b>(1) What makes a window invalid?</b> Here: a repeated character. <b>(2) What do I do to fix it?</b> Evict from the left. <b>(3) When do I record?</b> After it is valid, if I want the longest; during the shrink, if I want the shortest. Answer those three in English before writing a line, and the code writes itself. If you cannot answer (2) — if shrinking from the left does not obviously restore legality — the problem is probably not a sliding window at all.'
  }
});

</script>
